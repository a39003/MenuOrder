spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:restaurant}?ssl-mode=REQUIRED
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

app.cors.allowed-origins=http://localhost:3000,http://localhost:4000,http://localhost:4200,http://172.20.10.2:3000,https://menuorder-2.onrender.com

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:14}
app.payment.bank-code=${PAYMENT_BANK_CODE}
app.payment.bank-name=${PAYMENT_BANK_NAME}
app.payment.account-number=${PAYMENT_ACCOUNT_NUMBER}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME}
