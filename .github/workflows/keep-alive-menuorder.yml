name: Keep Render menuorder-1 alive

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping menuorder-1.onrender.com
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://menuorder-1.onrender.com/)
          echo "Pong at $(date -u +%Y-%m-%dT%H:%M:%SZ) -- Status: $STATUS"
